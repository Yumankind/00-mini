packages:
  - "apps/*"
  - "packages/*"
  # The two static Workers are deployed with the Homebrew wrangler and hold no node_modules: their
  # bytes are BUILT from apps/infinite (a member). See docs/HANDOFF-infinite-agent.md §9.1.
  - "!apps/infinite-site"
  - "!apps/infinite-preview-site"
# `pnpm run <script>` never chains an install; installing is its own deliberate act.
verifyDepsBeforeRun: false
# The two native packages Transformers.js pulls in for its Node path are allowed to build, as the 00
# repository allows them; sharp is its Node-only image path and nothing here reaches it.
allowBuilds:
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: false
